name: Publish Verified Model to Hugging Face

on:
  workflow_dispatch:
    inputs:
      synthetic_rows:
        description: "Number of reproducible synthetic training rows"
        required: true
        default: "10000"
        type: choice
        options: [5000, 10000, 25000]

permissions:
  contents: read

concurrency:
  group: huggingface-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: huggingface-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,huggingface]"
      - name: Run test suite
        run: pytest
      - name: Train reproducible release candidate
        run: >-
          python scripts/train_and_evaluate.py
          --source synthetic
          --synthetic-rows ${{ inputs.synthetic_rows }}
          --seed 42
          --output-dir artifacts/fraud-detection-xai
      - name: Enforce release structure, runtime and quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact_dir = Path('artifacts/fraud-detection-xai')
          required = {
              'model.joblib',
              'metrics.json',
              'feature_schema.json',
              'runtime.json',
              'SHA256SUMS.txt',
          }
          present = {path.name for path in artifact_dir.iterdir() if path.is_file()}
          missing = required - present
          assert not missing, f'Missing release files: {sorted(missing)}'

          report = json.loads((artifact_dir / 'metrics.json').read_text())
          runtime = json.loads((artifact_dir / 'runtime.json').read_text())
          test = report['test']
          assert report['metadata']['data_source'].startswith('synthetic:'), report['metadata']
          assert runtime['packages']['scikit-learn'] == '1.9.0', runtime
          assert test['pr_auc'] >= max(0.20, test['positive_rate'] * 3.0), test
          assert test['roc_auc'] >= 0.75, test
          assert test['recall'] >= 0.70, test
          assert test['latency_ms_per_row'] < 10.0, test
          print('Release gates passed:', test)
          PY
          cd artifacts/fraud-detection-xai
          sha256sum --check SHA256SUMS.txt
      - name: Upload immutable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-release-candidate
          path: artifacts/fraud-detection-xai/
      - name: Upload versioned model artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          hf auth whoami
          hf repos create lead-ai-labs/fraud-detection-xai --type model --exist-ok
          hf upload lead-ai-labs/fraud-detection-xai artifacts/fraud-detection-xai . \
            --type model \
            --commit-message "Publish verified fraud model, runtime and checksums"
          hf upload lead-ai-labs/fraud-detection-xai models/fraud-detection-xai/README.md README.md \
            --type model \
            --commit-message "Update auditable model card"
