name: Publish Verified Model to Hugging Face

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Training source"
        required: true
        default: "synthetic"
        type: choice
        options: [synthetic, repository_csv]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: huggingface-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,huggingface]"
      - name: Run test suite
        run: pytest
      - name: Train candidate model
        run: |
          if [ "${{ inputs.source }}" = "repository_csv" ]; then
            python scripts/train_and_evaluate.py --source csv --output-dir artifacts/fraud-detection-xai
          else
            python scripts/train_and_evaluate.py --source synthetic --synthetic-rows 10000 --seed 42 --output-dir artifacts/fraud-detection-xai
          fi
      - name: Enforce release gates
        run: |
          python - <<'PY'
          import json
          report = json.load(open('artifacts/fraud-detection-xai/metrics.json'))
          test = report['test']
          assert test['pr_auc'] >= max(0.20, test['positive_rate'] * 3.0), test
          assert test['roc_auc'] >= 0.75, test
          assert test['recall'] >= 0.70, test
          assert test['latency_ms_per_row'] < 10.0, test
          print('Release gates passed:', test)
          PY
      - name: Upload versioned model artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          hf auth whoami
          hf repos create lead-ai-labs/fraud-detection-xai --type model --exist-ok
          hf upload lead-ai-labs/fraud-detection-xai artifacts/fraud-detection-xai . \
            --type model \
            --commit-message "Publish CI-verified fraud model and metrics"
          hf upload lead-ai-labs/fraud-detection-xai models/fraud-detection-xai/README.md README.md \
            --type model \
            --commit-message "Update model card"
