name: ARC Prize 2026 CI

on:
  push:
    paths:
      - "competitions/arc-prize-2026/**"
      - ".github/workflows/arc-prize-2026-ci.yml"
  pull_request:
    paths:
      - "competitions/arc-prize-2026/**"
      - ".github/workflows/arc-prize-2026-ci.yml"

permissions:
  contents: read

jobs:
  test-agent-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: competitions/arc-prize-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: competitions/arc-prize-2026/pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --upgrade pip pytest ruff

      - name: Run tests
        run: python -m pytest -q

      - name: Compile agent
        run: python -m py_compile agent/my_agent.py

      - name: Lint competition package
        run: ruff check agent tests
