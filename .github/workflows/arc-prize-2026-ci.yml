name: ARC Prize 2026 Quality Gates

on:
  push:
    paths:
      - "competitions/arc-prize-2026/**"
      - ".github/workflows/arc-prize-2026-ci.yml"
  pull_request:
    paths:
      - "competitions/arc-prize-2026/**"
      - ".github/workflows/arc-prize-2026-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-prize-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: competitions/arc-prize-2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: competitions/arc-prize-2026/pyproject.toml

      - name: Install locked validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run production preflight
        run: python scripts/preflight.py

      - name: Run tests with coverage
        run: |
          python -m pytest -q \
            --cov=agent \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Check undefined names and bug risks
        run: >-
          python -m ruff check
          --select F,B
          agent tests scripts

      - name: Compile Python sources
        run: python -m compileall -q agent tests scripts

      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap_official_starter.sh
          bash -n scripts/pin_official_framework.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: arc-prize-coverage
          path: competitions/arc-prize-2026/coverage.xml
          if-no-files-found: error
