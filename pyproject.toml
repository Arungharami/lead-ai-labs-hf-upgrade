[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-ai-fraud-bench"
version = "0.1.1"
description = "Reproducible fraud detection training, evaluation, and Kaggle Benchmarks tasks for Lead.AI Labs."
readme = "BENCHMARKS.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Arun Kumar Gharami"}]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
huggingface = ["datasets>=3.0", "huggingface-hub>=0.27"]
kaggle = ["kaggle>=2.2", "kaggle-benchmarks>=0.6.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
